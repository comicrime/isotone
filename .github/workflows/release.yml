name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python scripts/build_bundle.py --version "$TAG" --output dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/*.zip --title "Isotone $TAG" --generate-notes --verify-tag
